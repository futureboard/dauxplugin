[package]
name = "daux-tests"
description = "Cross-crate integration, ABI, real-time and bundle test suites for DAUxPlug."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
daux-abi = { workspace = true }
daux-audio = { workspace = true }
daux-bundle = { workspace = true }
daux-core = { workspace = true }
daux-events = { workspace = true }
daux-host = { workspace = true }
daux-midi = { workspace = true }
daux-parameter = { workspace = true }
daux-rt = { workspace = true }
daux-runtime = { workspace = true }
daux-scan = { workspace = true }
daux-state = { workspace = true }
daux-transport = { workspace = true }

[dev-dependencies]
daux-plugin = { workspace = true }
# Named directly, not through the facade, so the `derive_output` suite can prove the
# `#[params(crate = ::daux_plugin_api)]` escape hatch resolves. A workspace crate cannot
# depend on `daux-plugin` without a cycle, so that redirect is the only way such a crate can
# use the derives at all — and nothing else compiles its output.
daux-plugin-api = { workspace = true }
# Pulled in so that cargo builds `examples/gain`'s `cdylib` before this crate's tests run.
# The `end_to_end` suite finds that dynamic library next to the test binary, packages it into
# a real `.axt`, and drives it over the C ABI — which is the only way to exercise the
# `bundle → LoadLibrary → factory → instance → process` path end to end.
daux-example-gain = { workspace = true }

[lints]
workspace = true
